version: '3.8'

services:
  opensearch:
    # Official IBM Power (ppc64le) OpenSearch image from IBM Container Registry
    # Options:
    # - icr.io/ppc64le-oss/opensearch-ppc64le:3.3.0
    # - icr.io/ppc64le-oss/opensearch-ppc64le:3.5.0
    image: icr.io/ppc64le-oss/opensearch-ppc64le:3.3.0
    container_name: opensearch-vectordb
    environment:
      - discovery.type=single-node
      - plugins.security.disabled=true
      - "OPENSEARCH_JAVA_OPTS=-Xms2g -Xmx2g"
    ports:
      - "9200:9200"
      - "9600:9600"
    volumes:
      - opensearch-data:/usr/share/opensearch/data

volumes:
  opensearch-data:
